<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Quiet">
  <!-- The skin's own layout in four strokes: a rail, and a column of text
       beside it. Every colour is a token from the light palette, so the mark
       cannot drift from the product it stands for. -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13" fill="#fbfbfa" stroke="#ebebe8"/>
  <path d="M18 17v30" stroke="#dcdcd7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 21h20" stroke="#38548c" stroke-width="3" stroke-linecap="round"/>
  <path d="M25 30h17" stroke="#565b62" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 37h20" stroke="#565b62" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 44h11" stroke="#565b62" stroke-width="1.5" stroke-linecap="round"/>
</svg>
