name: Feature
description: One verifiable outcome
labels: ["type:feat"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this exists; what problem or goal it serves
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Verifiable completion criteria
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How completion will actually be checked
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
