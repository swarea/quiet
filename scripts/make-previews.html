<!doctype html>
<meta charset="utf-8">
<title>swarea skin — preview image generator</title>
<!--
  Tistory shows a skin thumbnail in the skin editor and skin list. It wants
  preview256.jpg (256x192), preview560.jpg (560x420) and preview1600.jpg
  (1600x1200). We have no image toolchain in the build, so the thumbnails are
  drawn here with the canvas API and downloaded, then committed to src/assets/.

  Open this file in a browser and press the button. Re-run it whenever the
  skin's colours or layout change materially.
-->
<style>
  body{font:15px/1.6 system-ui,sans-serif;margin:2rem;color:#191b1f}
  button{font:inherit;font-weight:600;background:#38548c;color:#fff;border:0;border-radius:6px;padding:.6rem 1.1rem;cursor:pointer}
  canvas{border:1px solid #e6e6e2;margin-top:1rem;max-width:100%}
</style>
<h1>Preview images</h1>
<p>Generates the three JPEG thumbnails Tistory uses. Save them into <code>src/assets/</code>.</p>
<button id="go" type="button">Generate and download</button>
<div id="out"></div>
<script>
  const C = {
    paper: "#f6f6f4", surface: "#ffffff", line: "#e6e6e2", wash: "#eef1f7",
    ink: "#191b1f", muted: "#565b62", faint: "#6b7078", accent: "#38548c",
  };

  function roundRect(x, x1, y1, w1, h1, r) {
    x.beginPath();
    x.moveTo(x1 + r, y1);
    x.arcTo(x1 + w1, y1, x1 + w1, y1 + h1, r);
    x.arcTo(x1 + w1, y1 + h1, x1, y1 + h1, r);
    x.arcTo(x1, y1 + h1, x1, y1, r);
    x.arcTo(x1, y1, x1 + w1, y1, r);
    x.closePath();
  }

  // Draws a flat abstraction of the skin: sidebar rail on the left, centred
  // title, then hairline-separated post rows. Design coordinates assume a
  // 560px wide canvas and scale from there.
  function draw(w, h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    const s = w / 560;
    x.fillStyle = C.paper; x.fillRect(0, 0, w, h);

    const railW = 150 * s;
    x.fillStyle = C.surface; x.fillRect(0, 0, railW, h);
    x.strokeStyle = C.line; x.lineWidth = Math.max(1, s);
    x.beginPath(); x.moveTo(railW, 0); x.lineTo(railW, h); x.stroke();

    x.fillStyle = C.accent; roundRect(x, 16 * s, 18 * s, 22 * s, 22 * s, 6 * s); x.fill();
    x.fillStyle = C.ink; x.fillRect(46 * s, 22 * s, 62 * s, 6 * s);
    x.fillStyle = C.faint; x.fillRect(46 * s, 33 * s, 46 * s, 4 * s);
    x.fillStyle = "#efefec"; roundRect(x, 16 * s, 54 * s, railW - 32 * s, 18 * s, 5 * s); x.fill();

    let y = 88 * s;
    x.fillStyle = C.faint; x.fillRect(16 * s, y, 34 * s, 4 * s); y += 14 * s;
    for (let i = 0; i < 6; i++) {
      if (i === 0) {
        x.fillStyle = C.wash; roundRect(x, 12 * s, y - 5 * s, railW - 24 * s, 16 * s, 4 * s); x.fill();
        x.fillStyle = C.accent;
      } else x.fillStyle = C.muted;
      x.fillRect(16 * s, y, (i === 0 ? 66 : 52 + (i * 5) % 34) * s, 5 * s);
      y += 20 * s;
    }

    const cx = railW + 40 * s;
    x.fillStyle = C.ink; x.fillRect(cx + 90 * s, 40 * s, 150 * s, 13 * s);
    x.fillStyle = C.faint; x.fillRect(cx + 118 * s, 62 * s, 94 * s, 5 * s);
    x.strokeStyle = C.line;
    x.beginPath(); x.moveTo(railW + 20 * s, 86 * s); x.lineTo(w - 20 * s, 86 * s); x.stroke();

    y = 108 * s;
    for (let i = 0; i < 3; i++) {
      x.fillStyle = C.faint; x.fillRect(cx, y + 4 * s, 26 * s, 5 * s);
      x.fillStyle = C.accent; x.fillRect(cx + 44 * s, y, 40 * s, 5 * s);
      x.fillStyle = C.ink; x.fillRect(cx + 44 * s, y + 12 * s, (150 - i * 22) * s, 7 * s);
      x.fillStyle = C.muted;
      x.fillRect(cx + 44 * s, y + 26 * s, (210 - i * 30) * s, 4 * s);
      x.fillRect(cx + 44 * s, y + 35 * s, (170 - i * 24) * s, 4 * s);
      x.strokeStyle = C.line;
      x.beginPath(); x.moveTo(cx, y + 52 * s); x.lineTo(w - 20 * s, y + 52 * s); x.stroke();
      y += 68 * s;
    }
    return c;
  }


  // Canvas can write JPEG and PNG but not GIF, which is why preview.gif was
  // absent from every package until the release script started checking. The
  // encoder is here rather than as a dependency because this drawing is a
  // handful of flat fills: its palette is tiny, and a GIF of flat colour needs
  // none of LZW's cleverness.
  //
  // Codes are written at a fixed nine bits and the dictionary is cleared before
  // it can ever grow past that, so every pixel is emitted literally. The result
  // is a larger file than a real LZW stream would be and a completely ordinary
  // GIF to every decoder. At 112x84 the difference is a few kilobytes.
  function encodeGif(imageData) {
    const { width, height, data } = imageData;

    // Flat fills mean few distinct colours; map them exactly, and fall back to
    // the nearest entry only if the drawing ever outgrows a full palette.
    const palette = [];
    const seen = new Map();
    const indexes = new Uint8Array(width * height);
    for (let i = 0; i < width * height; i += 1) {
      const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
      const key = (r << 16) | (g << 8) | b;
      let index = seen.get(key);
      if (index === undefined) {
        if (palette.length < 256) {
          index = palette.length;
          palette.push([r, g, b]);
          seen.set(key, index);
        } else {
          let best = 0, bestDistance = Infinity;
          for (let p = 0; p < palette.length; p += 1) {
            const dr = palette[p][0] - r, dg = palette[p][1] - g, db = palette[p][2] - b;
            const distance = dr * dr + dg * dg + db * db;
            if (distance < bestDistance) { bestDistance = distance; best = p; }
          }
          index = best;
        }
      }
      indexes[i] = index;
    }

    // The global colour table must be a power of two entries long.
    let bits = 1;
    while (1 << bits < palette.length) bits += 1;
    const tableSize = 1 << bits;

    const bytes = [];
    const pushShort = (v) => { bytes.push(v & 0xff, (v >> 8) & 0xff); };
    for (const ch of "GIF89a") bytes.push(ch.charCodeAt(0));
    pushShort(width); pushShort(height);
    bytes.push(0xf0 | (bits - 1), 0, 0);        // global table present, 8-bit depth
    for (let i = 0; i < tableSize; i += 1) {
      const [r, g, b] = palette[i] || [0, 0, 0];
      bytes.push(r, g, b);
    }
    bytes.push(0x2c);                            // image descriptor
    pushShort(0); pushShort(0); pushShort(width); pushShort(height);
    bytes.push(0);                               // no local table, not interlaced

    const MIN_CODE_SIZE = 8;
    const CLEAR = 1 << MIN_CODE_SIZE;            // 256
    const END = CLEAR + 1;                       // 257
    const CODE_BITS = MIN_CODE_SIZE + 1;         // 9
    const stream = [];
    let bitBuffer = 0, bitCount = 0;
    const emit = (code) => {
      bitBuffer |= code << bitCount;             // GIF packs bits least-significant first
      bitCount += CODE_BITS;
      while (bitCount >= 8) {
        stream.push(bitBuffer & 0xff);
        bitBuffer >>= 8;
        bitCount -= 8;
      }
    };

    emit(CLEAR);
    // After a clear the dictionary holds 258 entries and each literal adds one.
    // Clearing again before it reaches 512 keeps every code nine bits wide.
    let sinceClear = 0;
    for (let i = 0; i < indexes.length; i += 1) {
      emit(indexes[i]);
      sinceClear += 1;
      if (sinceClear === 253) { emit(CLEAR); sinceClear = 0; }
    }
    emit(END);
    if (bitCount > 0) stream.push(bitBuffer & 0xff);

    bytes.push(MIN_CODE_SIZE);
    for (let i = 0; i < stream.length; i += 255) {
      const chunk = stream.slice(i, i + 255);
      bytes.push(chunk.length, ...chunk);
    }
    bytes.push(0);                               // end of the image data blocks
    bytes.push(0x3b);                            // trailer
    return new Blob([new Uint8Array(bytes)], { type: "image/gif" });
  }

  const SIZES = [
    ["preview256.jpg", 256, 192],
    ["preview560.jpg", 560, 420],
    ["preview1600.jpg", 1600, 1200],
  ];

  document.getElementById("go").addEventListener("click", () => {
    const out = document.getElementById("out");
    out.textContent = "";
    for (const [name, w, h] of SIZES) {
      const canvas = draw(w, h);
      canvas.toBlob((blob) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }, "image/jpeg", 0.85);
      if (w <= 560) out.appendChild(canvas);
    }

    // The 112x84 fallback thumbnail Tistory asks for, in the only format it
    // accepts for that slot.
    const small = draw(112, 84);
    const pixels = small.getContext("2d").getImageData(0, 0, 112, 84);
    const gif = encodeGif(pixels);
    const link = document.createElement("a");
    link.href = URL.createObjectURL(gif);
    link.download = "preview.gif";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
    out.appendChild(small);
  });
</script>
