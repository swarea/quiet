<!doctype html>
<meta charset="utf-8">
<title>Quiet — social preview generator</title>
<!--
  GitHub has no per-repository icon. What it does have is a 1280x640 social
  preview, shown whenever a link to the repository is unfurled — in a chat, a
  post, a search result. That single image is the only place this project gets
  to look like itself outside its own page, so it is drawn here rather than
  screenshotted or assembled by hand.

  The composition is the mark and the name, at a size that survives being shown
  at a third of what is drawn. Both colours are tokens from the light palette
  and the type is the face the skin ships, so the card and the product are the
  same object. Why there is nothing else on it is set out beside the drawing.

  **Serve this file, do not open it from disk.** Two things break under file://:
  the bundled face is refused, and the mark cannot be drawn into a canvas the
  page is then allowed to read back. Both fail quietly and produce a card that
  looks finished, so the button refuses to generate unless it has them. Any
  static server over the repository root will do:

      npx serve .        then open /scripts/make-social.html

  Put the download in docs/assets/, replacing the file that is there. Re-run
  whenever the palette or the mark changes.
-->
<style>
  @font-face{
    font-family:"Quiet Preview";
    src:url("../src/fonts/source.woff2") format("woff2");
    font-weight:100 900;
    font-display:block;
  }
  body{font:15px/1.6 "Quiet Preview",system-ui,sans-serif;margin:2rem;color:#191b1f;background:#fbfbfa}
  button{font:inherit;font-weight:600;background:#38548c;color:#fff;border:0;border-radius:6px;padding:.6rem 1.1rem;cursor:pointer}
  button:hover{background:#2a4170}
  #out{display:grid;gap:1rem;margin-top:1rem;justify-items:start}
  canvas{border:1px solid #ebebe8;max-width:100%}
</style>
<h1>Social preview</h1>
<p>Generates the 1280&times;640 card GitHub unfurls. Save it into <code>docs/assets/</code>.</p>
<button id="go" type="button">Generate and download</button>
<div id="out"></div>
<script>
  // Copied from src/styles/tokens.css, keyed by the token they come from. The
  // validation gate asserts they still match: a hand-copied palette drifts, and
  // this card is the first thing anyone sees of the project.
  const TOKENS = {
    "--light-paper": "#fbfbfa",
    "--light-ink": "#191b1f",
  };
  const C = {
    paper: TOKENS["--light-paper"],
    ink: TOKENS["--light-ink"],
  };

  const W = 1280, H = 640;
  // The mark is a square tile with about a sixth of its width as margin inside
  // it, so the drawn box has to be larger than the artwork is meant to look.
  // At 224 the building stood barely taller than the word beside it.
  const MARK = 372;
  const GAP = 64;             // mark to word
  const TITLE = 176;

  function draw(mark) {
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const x = canvas.getContext("2d");

    x.fillStyle = C.paper;
    x.fillRect(0, 0, W, H);

    // The mark and the name, and nothing else.
    //
    // An unfurled card is not read at 1280 wide. Slack shows it around 360, so
    // everything in it is at 0.28 of what is drawn here: a 35px sentence lands
    // at 10px and a 25px URL at 7px, neither of which is text any more. The
    // card had both, and a monospace eyebrow above them.
    //
    // They were also saying what the reader is already being told. Every
    // platform that unfurls a link prints the repository's title and
    // description beside the image, as real text at the reader's own size, from
    // the page's own metadata. The sentence in the picture was a worse copy of
    // the sentence underneath it.
    //
    // What survives the reduction is a shape and a short word, so that is what
    // is left.
    x.font = `700 ${TITLE}px "Quiet Preview", system-ui, sans-serif`;
    x.textBaseline = "alphabetic";
    const name = x.measureText("Quiet");

    // The pair is centred as one object, so the margins come out equal whatever
    // the word measures. Anchored to a fixed left inset instead, the right
    // margin was whatever the text happened to leave: 104 against 274.
    //
    // Centred on where the ink lands, not on the advance width, which carries
    // the side bearing past the last stem of the "t" -- 5px of it here, spent
    // on the right margin only.
    const inkLeft = name.actualBoundingBoxLeft;
    const inkWidth = inkLeft + name.actualBoundingBoxRight;
    const left = Math.round((W - (MARK + GAP + inkWidth)) / 2);
    x.drawImage(mark, left, (H - MARK) / 2, MARK, MARK);

    // Centred on the glyphs, not on the line box. A line box carries space
    // above the capital and below the baseline that this word does not fill --
    // "Quiet" has one ascender and one descender -- so centring the box would
    // leave it sitting visibly high against the mark.
    const up = name.actualBoundingBoxAscent;
    const down = name.actualBoundingBoxDescent;
    x.fillStyle = C.ink;
    x.fillText("Quiet", left + MARK + GAP + inkLeft, (H + up - down) / 2);

    return canvas;
  }

  function download(blob, name) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
  }

  document.getElementById("go").addEventListener("click", async () => {
    const out = document.getElementById("out");
    out.textContent = "";
    out.style.color = "";

    try {
      await document.fonts.load('400 104px "Quiet Preview"');
      await document.fonts.load('700 104px "Quiet Preview"');
      await document.fonts.ready;
    } catch (e) {
      /* reported by the check below */
    }
    if (!document.fonts.check('700 104px "Quiet Preview"')) {
      out.textContent =
        "The bundled typeface did not load, so the card would be drawn in a " +
        "fallback face. Serve the repository over http rather than opening this " +
        "file from disk, then try again.";
      out.style.color = "#a3202f";
      return;
    }

    const mark = new Image();
    mark.src = "../docs/assets/mark.png";
    try {
      await mark.decode();
    } catch (e) {
      out.textContent = "docs/assets/mark.png could not be loaded: " + e.message;
      out.style.color = "#a3202f";
      return;
    }

    const canvas = draw(mark);
    canvas.toBlob((blob) => download(blob, "social1280.png"), "image/png");
    out.appendChild(canvas);
  });
</script>
